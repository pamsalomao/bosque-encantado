<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20150d">
  <title>Bosque Encantado da Malu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <!-- Fundo desfocado: preenche a tela sem cortar a arte principal -->
    <div class="ambient-bg" id="ambientBg" aria-hidden="true"></div>

    <div class="book-stage">
      <div class="book" id="book">

        <!-- PÁGINA 2 FICA POR BAIXO -->
        <section class="page page-two" id="pageTwo" aria-hidden="true">
          <div class="page-frame">
            <img
              class="art"
              src="imagens/pagina2.png"
              alt="Confirmação de presença do Bosque Encantado da Malu"
              draggable="false"
            >

            <!-- Campo funcional sobre o campo desenhado na imagem -->
            <form
              id="rsvpForm"
              action="https://script.google.com/macros/s/AKfycbyGTDZ2F5nMObMUIIZYVHmabqmh7gmTsfAKyaQumgGIoTa4FSbtm0IMfk48s6pIwZta/exec"
              method="POST"
              target="submitFrame"
              autocomplete="off"
            >
              <input
                id="guestName"
                class="name-input"
                name="nome"
                type="text"
                maxlength="80"
                autocomplete="name"
                placeholder="Digite seu nome"
                aria-label="Seu nome"
                required
              >

              <!-- Botão invisível sobre o botão já desenhado -->
              <button
                id="confirmButton"
                class="hotspot confirm-hotspot"
                type="submit"
                aria-label="Confirmar presença"
              ></button>
            </form>

            <!-- Botão invisível sobre o “Voltar” desenhado -->
            <button
              id="backButton"
              class="hotspot back-hotspot"
              type="button"
              aria-label="Voltar à primeira página"
            ></button>

            <div id="sendingMessage" class="sending" hidden>
              Enviando...
            </div>

            <div id="successMessage" class="success" hidden>
              <strong>Oba!</strong>
              <span>Sua presença foi confirmada.</span>
              <small>A Malu espera por você! ♥</small>
            </div>
          </div>
        </section>

        <!-- PÁGINA 1 É A FOLHA QUE VIRA -->
        <section class="page page-one" id="pageOne">
          <div class="flip-sheet" id="flipSheet">
            <div class="face front">
              <img
                class="art"
                src="imagens/pagina1.png"
                alt="Convite Bosque Encantado da Malu"
                draggable="false"
              >

              <!-- Área clicável sobre “Confirme sua presença aqui” -->
              <button
                id="turnPageButton"
                class="hotspot page-one-hotspot"
                type="button"
                aria-label="Confirme sua presença aqui"
              ></button>

              <div class="turn-shadow" aria-hidden="true"></div>
            </div>

            <!-- Verso da folha durante a virada -->
            <div class="face back" aria-hidden="true">
              <div class="paper-back"></div>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <iframe
    id="submitFrame"
    name="submitFrame"
    title="Envio da confirmação"
    src="about:blank"
    hidden
  ></iframe>

  <script src="script.js"></script>
</body>
</html>
