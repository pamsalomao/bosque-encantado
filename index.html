<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#efe9db">
  <title>Bosque Encantado da Malu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Updock&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-shell">
    <div class="book" id="book">

      <section class="page page-one" aria-label="Convite Bosque Encantado da Malu">
        <img class="invite-image" src="imagens/pagina1.jpg" alt="Convite Bosque Encantado da Malu">
        <button id="openBook" class="page-one-hotspot" type="button"
                aria-label="Confirme sua presença aqui"></button>
      </section>

      <section class="page page-two" id="pageTwo" aria-hidden="true">
        <div class="page-two-content">
          <div class="confirm-card">
            <h1 class="updock">Você vem?</h1>
            <p>
              Digite seu nome abaixo para confirmar sua presença no
              Bosque Encantado da Malu.
            </p>

            <form id="rsvpForm" action="https://script.google.com/macros/s/AKfycbyGTDZ2F5nMObMUIIZYVHmabqmh7gmTsfAKyaQumgGIoTa4FSbtm0IMfk48s6pIwZta/exec" method="POST" target="submitFrame">
              <label for="guestName">Seu nome</label>
              <input id="guestName" name="nome" type="text"
                     maxlength="80" placeholder="Digite seu nome"
                     autocomplete="name" required>

              <button id="confirmButton" class="confirm-button updock" type="submit">
                Confirmar presença
              </button>

              <p id="statusMessage" class="status" aria-live="polite"></p>
            </form>

            <div id="successBox" class="success" hidden>
              <h2 class="updock">Oba!</h2>
              <p>Sua presença foi confirmada.</p>
              <p class="updock success-final">A Malu espera por você! ♥</p>
            </div>

            <button id="backButton" class="back-button" type="button">← Voltar</button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <iframe name="submitFrame" title="Envio da confirmação" hidden></iframe>
  <script src="script.js"></script>
</body>
</html>
