<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f160f">
  <title>Bosque Encantado da Malu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="viewport">
    <div class="book" id="book">

      <!-- PÁGINA 1 -->
      <section class="page page-1" id="page1" aria-label="Convite do Bosque Encantado da Malu">
        <div class="sheet sheet-1">
          <img src="imagens/pagina1.png" alt="Convite do Bosque Encantado da Malu">

          <!-- Área clicável posicionada sobre o botão que já existe na imagem -->
          <button
            id="turnPageButton"
            class="hotspot page1-button"
            type="button"
            aria-label="Confirme sua presença aqui"
          ></button>
        </div>
      </section>

      <!-- PÁGINA 2 -->
      <section class="page page-2" id="page2" aria-hidden="true">
        <div class="sheet sheet-2">
          <img src="imagens/pagina2.png" alt="Página para confirmação de presença">

          <form
            id="rsvpForm"
            class="rsvp-form"
            action="https://script.google.com/macros/s/AKfycbyGTDZ2F5nMObMUIIZYVHmabqmh7gmTsfAKyaQumgGIoTa4FSbtm0IMfk48s6pIwZta/exec"
            method="POST"
            target="submitFrame"
          >
            <!-- Campo real sobre o campo desenhado na imagem -->
            <input
              id="guestName"
              class="name-input"
              name="nome"
              type="text"
              maxlength="80"
              autocomplete="name"
              placeholder="Digite seu nome"
              aria-label="Seu nome"
              required
            >

            <!-- Botão real sobre o botão desenhado na imagem -->
            <button
              id="confirmButton"
              class="hotspot page2-confirm"
              type="submit"
              aria-label="Confirmar presença"
            ></button>
          </form>

          <!-- Botão real sobre o “Voltar” desenhado na imagem -->
          <button
            id="backButton"
            class="hotspot page2-back"
            type="button"
            aria-label="Voltar para a primeira página"
          ></button>

          <div id="sendingMessage" class="feedback" hidden>
            Enviando...
          </div>

          <div id="successMessage" class="success-panel" hidden>
            <strong>Oba!</strong>
            <span>Sua presença foi confirmada.</span>
            <small>A Malu espera por você! ♥</small>
          </div>
        </div>
      </section>

    </div>
  </main>

  <iframe
    id="submitFrame"
    name="submitFrame"
    title="Envio da confirmação"
    hidden
  ></iframe>

  <script src="script.js"></script>
</body>
</html>
